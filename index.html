<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Loan & EMI Manager</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            blue: '#0052ff', // Signature vibrant POS blue
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f8f9fc;
        }
        [x-cloak] { display: none !important; }
        
        /* Custom smooth scrollbars */
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Input OTP appearance */
        .otp-input:focus {
            box-shadow: 0 0 0 3px rgba(0, 82, 255, 0.2);
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen pb-12" x-data="posApp()" x-init="initApp()">

    <!-- APP CONTAINER -->
    <div class="max-w-3xl mx-auto px-4 sm:px-6 pt-6 space-y-6">

        <!-- ====================================================================== -->
        <!-- 1. AUTHENTICATION SECTION (OTP Phone Login)                            -->
        <!-- ====================================================================== -->
        <template x-if="!userLoggedIn">
            <div class="min-h-[85vh] flex flex-col justify-center items-center py-8">
                <div class="w-full max-w-md bg-white rounded-3xl border border-slate-200/90 p-8 shadow-xl space-y-6">
                    
                    <!-- App Logo & Branding Header -->
                    <div class="text-center space-y-2">
                        <div class="w-16 h-16 rounded-2xl bg-brand-blue/10 text-brand-blue flex items-center justify-center mx-auto text-2xl font-black shadow-inner">
                            <i class="fa-solid fa-receipt"></i>
                        </div>
                        <h1 class="text-2xl font-black text-slate-900 tracking-tight">POS Loan Manager</h1>
                        <p class="text-xs font-medium text-slate-500">Access your cloud loan records securely from any device</p>
                    </div>

                    <!-- STEP 1: Enter Phone Number -->
                    <div x-show="authStep === 1" x-transition>
                        <form @submit.prevent="sendOtpCode()" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Mobile Phone Number</label>
                                <div class="relative flex items-center">
                                    <span class="absolute left-3.5 text-xs font-bold text-slate-400 border-r border-slate-200 pr-2">+91</span>
                                    <input type="tel" 
                                           x-model="phoneNumber" 
                                           maxlength="10"
                                           placeholder="9876543210" 
                                           required 
                                           class="w-full pl-16 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold tracking-wide text-slate-800 focus:bg-white focus:border-brand-blue focus:outline-none transition">
                                </div>
                                <p class="text-[11px] text-slate-400 mt-1">We'll send a 6-digit verification code via OTP.</p>
                            </div>

                            <button type="submit" 
                                    :disabled="authLoading"
                                    class="w-full py-3.5 bg-brand-blue hover:bg-blue-700 text-white font-bold rounded-xl text-sm shadow-lg shadow-blue-500/25 active:scale-95 transition flex items-center justify-center space-x-2">
                                <span x-show="!authLoading">Get OTP Verification Code</span>
                                <span x-show="authLoading"><i class="fa-solid fa-circle-notch fa-spin"></i> Sending OTP...</span>
                            </button>
                        </form>

                        <div class="mt-4 pt-4 border-t border-slate-100">
                            <button @click="quickDemoLogin()" class="w-full py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition flex items-center justify-center space-x-2">
                                <i class="fa-solid fa-bolt text-amber-500"></i>
                                <span>Quick Demo Login (Skip Real SMS)</span>
                            </button>
                        </div>
                    </div>

                    <!-- STEP 2: Enter 6-Digit OTP -->
                    <div x-show="authStep === 2" x-transition class="space-y-4">
                        <div class="text-center">
                            <span class="text-xs font-semibold text-slate-500">OTP sent to </span>
                            <span class="text-xs font-extrabold text-slate-800" x-text="'+91 ' + phoneNumber"></span>
                            <button @click="authStep = 1" class="text-brand-blue text-xs font-bold ml-1 hover:underline">Edit</button>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-2 text-center">Enter 6-Digit Verification Code</label>
                            <div class="flex justify-center space-x-2" @paste="handleOtpPaste($event)">
                                <template x-for="(digit, index) in otpDigits" :key="index">
                                    <input type="text" 
                                           maxlength="1" 
                                           x-model="otpDigits[index]"
                                           @input="handleOtpInput($event, index)"
                                           @keydown.backspace="handleOtpBackspace($event, index)"
                                           :id="'otp-input-' + index"
                                           class="otp-input w-11 h-12 text-center text-lg font-bold bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-brand-blue focus:outline-none transition">
                                </template>
                            </div>
                            <div class="text-center mt-2">
                                <span class="text-[11px] text-slate-400">Demo Code: <strong class="text-slate-600">123456</strong></span>
                            </div>
                        </div>

                        <button @click="verifyOtpCode()" 
                                :disabled="authLoading"
                                class="w-full py-3.5 bg-brand-blue hover:bg-blue-700 text-white font-bold rounded-xl text-sm shadow-lg shadow-blue-500/25 active:scale-95 transition flex items-center justify-center space-x-2">
                            <span x-show="!authLoading">Verify & Sign In</span>
                            <span x-show="authLoading"><i class="fa-solid fa-circle-notch fa-spin"></i> Verifying...</span>
                        </button>

                        <div class="text-center pt-2">
                            <button @click="sendOtpCode()" class="text-xs font-bold text-slate-500 hover:text-brand-blue transition">
                                Resend OTP Code
                            </button>
                        </div>
                    </div>

                    <!-- Firebase Status Banner -->
                    <div class="bg-slate-50 rounded-xl p-3 border border-slate-100 text-[11px] text-slate-500 flex items-center justify-between">
                        <span class="flex items-center space-x-1.5">
                            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                            <span>Cloud Sync Engine</span>
                        </span>
                        <span class="font-bold text-slate-600" x-text="syncStatus">Initializing...</span>
                    </div>

                </div>
            </div>
        </template>

        <!-- ====================================================================== -->
        <!-- 2. MAIN APPLICATION WORKSPACE (Accessible when Logged In)               -->
        <!-- ====================================================================== -->
        <template x-if="userLoggedIn">
            <div class="space-y-6">
                
                <!-- Top Header Navigation / User Banner -->
                <header class="flex items-center justify-between pt-2">
                    <div>
                        <div class="flex items-center space-x-2 mb-1">
                            <span class="text-[11px] font-extrabold tracking-wider text-brand-blue uppercase">POS Manager</span>
                            <span class="px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 text-[10px] font-bold">
                                <i class="fa-solid fa-cloud text-[9px] mr-0.5"></i> Cloud Connected
                            </span>
                        </div>
                        <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight" x-text="getGreeting()">Good morning</h1>
                        <p class="text-xs font-medium text-slate-500 mt-0.5" x-text="'Logged in as +91 ' + userPhone"></p>
                    </div>

                    <div class="flex items-center space-x-2">
                        <!-- User Profile / Logout Dropdown Button -->
                        <div class="relative" x-data="{ open: false }">
                            <button @click="open = !open" class="w-11 h-11 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center font-bold text-sm border border-slate-200 transition">
                                <i class="fa-solid fa-user-circle text-lg"></i>
                            </button>
                            <!-- Dropdown Menu -->
                            <div x-show="open" @click.away="open = false" x-cloak class="absolute right-0 mt-2 w-48 bg-white rounded-2xl shadow-xl border border-slate-100 py-2 z-50 text-xs font-medium">
                                <div class="px-4 py-2 border-b border-slate-100">
                                    <div class="font-bold text-slate-800" x-text="'+91 ' + userPhone"></div>
                                    <div class="text-[10px] text-slate-400 truncate" x-text="'ID: ' + currentUserId"></div>
                                </div>
                                <button @click="syncCloudData()" class="w-full text-left px-4 py-2 hover:bg-slate-50 text-slate-700 flex items-center space-x-2">
                                    <i class="fa-solid fa-rotate text-brand-blue"></i>
                                    <span>Sync Cloud Now</span>
                                </button>
                                <button @click="logoutUser()" class="w-full text-left px-4 py-2 hover:bg-rose-50 text-rose-600 font-bold flex items-center space-x-2 border-t border-slate-100">
                                    <i class="fa-solid fa-right-from-bracket"></i>
                                    <span>Sign Out Account</span>
                                </button>
                            </div>
                        </div>

                        <!-- Add Loan Button -->
                        <button @click="openModal('add')" class="w-11 h-11 rounded-2xl bg-brand-blue hover:bg-blue-700 text-white flex items-center justify-center shadow-lg shadow-blue-500/25 transition-transform active:scale-95" title="Quick Add Loan">
                            <i class="fa-solid fa-plus text-base"></i>
                        </button>
                    </div>
                </header>

                <!-- Search Bar with Filter Trigger -->
                <div class="relative flex items-center">
                    <div class="relative flex-1">
                        <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-base"></i>
                        <input type="text" 
                               x-model="searchQuery" 
                               placeholder="Search customers, phone or loan IDs" 
                               class="w-full pl-11 pr-10 py-3.5 bg-white border border-slate-200/90 rounded-2xl text-sm font-medium text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-blue/30 focus:border-brand-blue shadow-sm transition">
                        <button x-show="searchQuery" @click="searchQuery = ''" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 p-1">
                            <i class="fa-solid fa-xmark text-xs"></i>
                        </button>
                    </div>
                    <button @click="statusFilter = (statusFilter === 'all' ? 'dp_due' : 'all')" 
                            class="ml-3 p-3.5 bg-white border border-slate-200/90 rounded-2xl text-slate-500 hover:text-brand-blue hover:border-brand-blue shadow-sm transition"
                            title="Toggle Filter">
                        <i class="fa-solid fa-sliders text-base"></i>
                    </button>
                </div>

                <!-- Portfolio Overview Section -->
                <section class="space-y-3">
                    <div class="flex items-center justify-between">
                        <h2 class="text-base font-bold text-slate-900">Portfolio overview</h2>
                        <span class="text-xs font-semibold text-slate-400" x-text="isSyncing ? 'Syncing...' : 'Live Records'"></span>
                    </div>

                    <!-- Metric Cards Grid -->
                    <div class="grid grid-cols-3 gap-3">
                        <!-- Stat 1: Active Loans -->
                        <div @click="statusFilter = 'all'" 
                             class="bg-white p-4 rounded-2xl border transition cursor-pointer flex flex-col justify-between h-28"
                             :class="statusFilter === 'all' ? 'border-brand-blue ring-2 ring-brand-blue/10 bg-blue-50/10' : 'border-slate-200/80 hover:border-slate-300 shadow-sm'">
                            <div class="w-8 h-8 rounded-xl bg-blue-100/70 text-brand-blue flex items-center justify-center text-sm">
                                <i class="fa-solid fa-briefcase"></i>
                            </div>
                            <div>
                                <div class="text-2xl font-extrabold text-slate-900 leading-none" x-text="stats.totalLoans">0</div>
                                <div class="text-[12px] font-medium text-slate-500 mt-1">Active loans</div>
                            </div>
                        </div>

                        <!-- Stat 2: Pending DP -->
                        <div @click="statusFilter = 'dp_due'" 
                             class="bg-white p-4 rounded-2xl border transition cursor-pointer flex flex-col justify-between h-28"
                             :class="statusFilter === 'dp_due' ? 'border-amber-500 ring-2 ring-amber-500/10 bg-amber-50/10' : 'border-slate-200/80 hover:border-slate-300 shadow-sm'">
                            <div class="w-8 h-8 rounded-xl bg-amber-100/70 text-amber-600 flex items-center justify-center text-sm">
                                <i class="fa-regular fa-clock"></i>
                            </div>
                            <div>
                                <div class="text-2xl font-extrabold text-slate-900 leading-none" x-text="stats.pendingDpCount">0</div>
                                <div class="text-[12px] font-medium text-slate-500 mt-1">Pending DP</div>
                            </div>
                        </div>

                        <!-- Stat 3: Fully Paid -->
                        <div @click="statusFilter = 'cleared'" 
                             class="bg-white p-4 rounded-2xl border transition cursor-pointer flex flex-col justify-between h-28"
                             :class="statusFilter === 'cleared' ? 'border-emerald-500 ring-2 ring-emerald-500/10 bg-emerald-50/10' : 'border-slate-200/80 hover:border-slate-300 shadow-sm'">
                            <div class="w-8 h-8 rounded-xl bg-emerald-100/70 text-emerald-600 flex items-center justify-center text-sm">
                                <i class="fa-regular fa-circle-check"></i>
                            </div>
                            <div>
                                <div class="text-2xl font-extrabold text-slate-900 leading-none" x-text="stats.fullyPaidCount">0</div>
                                <div class="text-[12px] font-medium text-slate-500 mt-1">Fully paid</div>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Loan Records Section -->
                <section class="space-y-4 pt-2">
                    <div class="flex items-center justify-between">
                        <h2 class="text-lg font-bold text-slate-900">Loan records</h2>
                        <button @click="openModal('add')" class="bg-brand-blue hover:bg-blue-700 text-white font-semibold text-xs px-3.5 py-2.5 rounded-xl flex items-center shadow-md shadow-blue-500/20 active:scale-95 transition">
                            <i class="fa-solid fa-plus mr-1.5 text-[10px]"></i> New loan
                        </button>
                    </div>

                    <!-- Status Filter Tabs -->
                    <div class="flex items-center space-x-2 overflow-x-auto custom-scrollbar pb-1">
                        <button @click="statusFilter = 'all'" 
                                class="px-4 py-2 rounded-xl text-xs font-semibold transition whitespace-nowrap"
                                :class="statusFilter === 'all' ? 'bg-blue-100 text-brand-blue font-bold' : 'bg-slate-200/60 text-slate-600 hover:bg-slate-200'">
                            All records
                        </button>
                        <button @click="statusFilter = 'dp_due'" 
                                class="px-4 py-2 rounded-xl text-xs font-semibold transition whitespace-nowrap"
                                :class="statusFilter === 'dp_due' ? 'bg-blue-100 text-brand-blue font-bold' : 'bg-slate-200/60 text-slate-600 hover:bg-slate-200'">
                            Pending DP
                        </button>
                        <button @click="statusFilter = 'pending'" 
                                class="px-4 py-2 rounded-xl text-xs font-semibold transition whitespace-nowrap"
                                :class="statusFilter === 'pending' ? 'bg-blue-100 text-brand-blue font-bold' : 'bg-slate-200/60 text-slate-600 hover:bg-slate-200'">
                            Pending EMIs
                        </button>
                        <button @click="statusFilter = 'cleared'" 
                                class="px-4 py-2 rounded-xl text-xs font-semibold transition whitespace-nowrap"
                                :class="statusFilter === 'cleared' ? 'bg-blue-100 text-brand-blue font-bold' : 'bg-slate-200/60 text-slate-600 hover:bg-slate-200'">
                            Fully paid
                        </button>
                    </div>

                    <!-- Customer Cards List -->
                    <div class="space-y-3">
                        <template x-for="customer in filteredCustomers" :key="customer.id">
                            <div class="bg-white rounded-2xl border border-slate-200/80 p-5 shadow-sm hover:shadow-md transition">
                                
                                <!-- Card Header -->
                                <div class="flex items-center justify-between pb-4 border-b border-slate-100">
                                    <div class="flex items-center space-x-3 cursor-pointer" @click="viewCustomerDetails(customer)">
                                        <div class="w-10 h-10 rounded-xl bg-blue-100/80 text-brand-blue font-bold text-sm flex items-center justify-center tracking-tight" x-text="getInitials(customer.name)">
                                        </div>
                                        <div>
                                            <h3 class="font-bold text-slate-900 text-base leading-tight hover:text-brand-blue transition" x-text="customer.name"></h3>
                                            <p class="text-xs font-medium text-slate-400 mt-0.5">
                                                <span x-text="customer.loanId"></span> · <span x-text="customer.productDetails"></span>
                                            </p>
                                        </div>
                                    </div>
                                    <button @click="viewCustomerDetails(customer)" class="text-slate-400 hover:text-slate-600 p-1">
                                        <i class="fa-solid fa-chevron-right text-xs"></i>
                                    </button>
                                </div>

                                <!-- Financial Row -->
                                <div class="grid grid-cols-2 gap-4 py-3 text-sm">
                                    <div>
                                        <span class="text-xs font-medium text-slate-400 block mb-0.5">Monthly EMI</span>
                                        <span class="font-bold text-slate-900 text-base" x-text="formatCurrency(customer.monthlyEmiAmount)"></span>
                                    </div>
                                    <div class="text-right">
                                        <span class="text-xs font-medium text-slate-400 block mb-0.5">Down payment</span>
                                        <button @click="toggleDpStatus(customer)" class="inline-block focus:outline-none">
                                            <span class="text-xs font-bold px-2 py-0.5 rounded-full"
                                                  :class="customer.dpStatus === 'Paid' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'"
                                                  x-text="customer.dpStatus === 'Paid' ? 'Paid' : 'Pending'">
                                            </span>
                                        </button>
                                    </div>
                                </div>

                                <!-- EMI Progress Bar -->
                                <div class="space-y-1.5 pt-1">
                                    <div class="flex items-center justify-between text-xs font-medium">
                                        <span class="text-slate-400">EMI progress</span>
                                        <span class="text-slate-700 font-semibold" x-text="getPaidCount(customer) + '/' + customer.numberOfEmis + ' paid'"></span>
                                    </div>
                                    <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
                                        <div class="h-full bg-brand-blue rounded-full transition-all duration-300" 
                                             :style="'width: ' + Math.min(100, Math.round((getPaidCount(customer) / customer.numberOfEmis) * 100)) + '%'">
                                        </div>
                                    </div>
                                </div>

                                <!-- Card Footer -->
                                <div class="pt-3.5 mt-2 flex items-center justify-between text-xs">
                                    <div class="text-slate-500 font-medium">
                                        <span x-text="(customer.numberOfEmis - getPaidCount(customer)) + ' remaining'"></span> · 
                                        <span class="text-slate-400" x-text="'Next due ' + getNextDueDate(customer)"></span>
                                    </div>
                                    <button @click="openScheduleModal(customer)" class="font-bold text-brand-blue hover:text-blue-700 transition">
                                        Manage EMIs
                                    </button>
                                </div>

                            </div>
                        </template>

                        <!-- Empty Search/List State -->
                        <div x-show="filteredCustomers.length === 0" class="bg-white rounded-2xl border border-slate-200/80 p-8 text-center text-slate-400 shadow-sm">
                            <div class="w-12 h-12 rounded-full bg-slate-100 text-slate-300 flex items-center justify-center mx-auto mb-3 text-xl">
                                <i class="fa-solid fa-folder-open"></i>
                            </div>
                            <p class="font-bold text-slate-700 text-sm">No customer loans found</p>
                            <p class="text-xs text-slate-400 mt-1">Try updating search filters or add a new loan record.</p>
                        </div>
                    </div>
                </section>

            </div>
        </template>

    </div>

    <!-- ====================================================================== -->
    <!-- 3. MODALS (Manage EMI, Add/Edit Loan, View Details, Delete)            -->
    <!-- ====================================================================== -->

    <!-- MODAL 1: Manage EMI Breakdown Modal -->
    <div x-show="showScheduleModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4">
        <div x-show="showScheduleModal" x-transition.opacity @click="showScheduleModal = false" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm"></div>

        <div x-show="showScheduleModal" x-transition class="relative bg-white rounded-3xl shadow-2xl w-full max-w-xl overflow-hidden z-10 flex flex-col max-h-[90vh]">
            <div class="bg-white px-6 py-4 flex justify-between items-center border-b border-slate-100">
                <div>
                    <h3 class="font-bold text-slate-900 text-base" x-text="activeScheduleCustomer ? activeScheduleCustomer.name + ' - EMI Breakdown' : 'EMI Schedule'"></h3>
                    <p class="text-xs text-slate-400 mt-0.5" x-text="activeScheduleCustomer ? 'Loan ID: ' + activeScheduleCustomer.loanId + ' • Tenure: ' + activeScheduleCustomer.numberOfEmis + ' Months' : ''"></p>
                </div>
                <button @click="showScheduleModal = false" class="w-8 h-8 rounded-full bg-slate-100 text-slate-400 hover:text-slate-600 flex items-center justify-center transition">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>

            <template x-if="activeScheduleCustomer">
                <div class="bg-slate-50 px-6 py-3 border-b border-slate-100 flex items-center justify-between text-xs">
                    <div class="font-semibold text-slate-600">
                        Paid: <span class="font-bold text-brand-blue" x-text="getPaidCount(activeScheduleCustomer)"></span> / <span x-text="activeScheduleCustomer.numberOfEmis"></span>
                    </div>
                    <div class="flex space-x-2">
                        <button @click="setAllEmisStatus(activeScheduleCustomer, true)" class="px-3 py-1 bg-emerald-100 text-emerald-700 hover:bg-emerald-200 rounded-lg font-bold text-[11px] transition">
                            Mark All Paid
                        </button>
                        <button @click="setAllEmisStatus(activeScheduleCustomer, false)" class="px-3 py-1 bg-slate-200 text-slate-700 hover:bg-slate-300 rounded-lg font-bold text-[11px] transition">
                            Reset All
                        </button>
                    </div>
                </div>
            </template>

            <div class="p-6 overflow-y-auto space-y-2.5 custom-scrollbar flex-1 bg-slate-50/30">
                <template x-if="activeScheduleCustomer && activeScheduleCustomer.schedule">
                    <template x-for="(emi, index) in activeScheduleCustomer.schedule" :key="index">
                        <div class="p-3.5 rounded-2xl border transition flex items-center justify-between"
                             :class="emi.isPaid ? 'bg-emerald-50/40 border-emerald-200/80' : 'bg-white border-slate-200/80 shadow-sm'">
                            <div class="flex items-center space-x-3">
                                <div class="w-8 h-8 rounded-xl font-bold text-xs flex items-center justify-center"
                                     :class="emi.isPaid ? 'bg-emerald-500 text-white' : 'bg-slate-100 text-slate-600'"
                                     x-text="'#' + emi.month">
                                </div>
                                <div>
                                    <div class="text-xs font-bold text-slate-900" x-text="'Month ' + emi.month"></div>
                                    <div class="text-[11px] text-slate-400" x-text="'Due: ' + formatDate(emi.dueDate)"></div>

    <script type="module">
        // Firebase Cloud Module Initialization
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global Firebase Configuration Guard
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'pos-loan-app-v1';
        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : {
                apiKey: "demo-api-key",
                authDomain: "demo-app.firebaseapp.com",
                projectId: "demo-app-pos",
                storageBucket: "demo-app.appspot.com",
                messagingSenderId: "123456789",
                appId: "1:123456789:web:demo"
            };

        // Initialize Firebase SDK
        let app, db, auth;
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            window._firebaseLoaded = true;
            window._firebaseApp = { app, db, auth, appId };
        } catch(e) {
            console.warn("Firebase running in offline fallback mode", e);
            window._firebaseLoaded = false;
        }

        // Expose Cloud Helpers to Alpine Engine
        window.cloudSync = {
            async authenticateUser(token) {
                if (!window._firebaseLoaded) return null;
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        const res = await signInWithCustomToken(auth, __initial_auth_token);
                        return res.user;
                    } else {
                        const res = await signInAnonymously(auth);
                        return res.user;
                    }
                } catch(err) {
                    console.error("Auth error:", err);
                    return null;
                }
            },
            
            subscribeToUserLoans(userId, callback, errorCb) {
                if (!window._firebaseLoaded || !userId) return () => {};
                // STRICT FIREBASE PATH RULE: /artifacts/{appId}/users/{userId}/{collectionName}
                const docRef = doc(db, 'artifacts', appId, 'users', userId, 'data', 'loans_record');
                return onSnapshot(docRef, (docSnap) => {
                    if (docSnap.exists()) {
                        callback(docSnap.data().items || []);
                    } else {
                        callback(null); // Document not yet initialized
                    }
                }, (error) => {
                    console.error("Firestore Listen Error:", error);
                    if (errorCb) errorCb(error);
                });
            },

            async saveUserLoans(userId, loansArray) {
                if (!window._firebaseLoaded || !userId) return;
                try {
                    const docRef = doc(db, 'artifacts', appId, 'users', userId, 'data', 'loans_record');
                    await setDoc(docRef, {
                        items: loansArray,
                        updatedAt: new Date().toISOString()
                    }, { merge: true });
                } catch (e) {
                    console.error("Firestore Save Error:", e);
                }
            },

            async logout() {
                if (window._firebaseLoaded && auth) {
                    await signOut(auth);
                }
            }
        };
    </script>

    <script>
        // Main Alpine.js Application Engine
        function posApp() {
            return {
                // Auth & Cloud State
                userLoggedIn: false,
                phoneNumber: '',
                otpDigits: ['', '', '', '', '', ''],
                authStep: 1,
                authLoading: false,
                syncStatus: 'Connecting...',
                currentUserId: null,
                userPhone: '',
                isSyncing: false,
                unsubscribeCloudListener: null,

                // Application Loans Data
                customers: [],
                searchQuery: '',
                statusFilter: 'all',

                // Modals Controls
                showModal: false,
                showScheduleModal: false,
                showDetailsModal: false,
                showDeleteModal: false,
                deletingCustomerId: null,
                activeScheduleCustomer: null,
                viewingCustomer: null,
                modalMode: 'add',

                // Form State
                formData: {
                    id: null,
                    name: '',
                    address: '',
                    phone: '',
                    loanId: '',
                    productDetails: '',
                    totalLoanAmount: 12000,
                    downPaymentAmount: 2000,
                    monthlyEmiAmount: 2500,
                    numberOfEmis: 4,
                    firstEmiDate: '',
                    dpStatus: 'Due'
                },

                // -------------------------------------------------------------
                // APP INITIALIZATION & AUTH HANDLERS
                // -------------------------------------------------------------
                async initApp() {
                    const savedSession = localStorage.getItem('pos_user_session');
                    if (savedSession) {
                        try {
                            const sess = JSON.parse(savedSession);
                            this.userPhone = sess.phone;
                            this.currentUserId = sess.userId;
                            this.userLoggedIn = true;
                            this.setupCloudSync();
                        } catch(e) {
                            localStorage.removeItem('pos_user_session');
                        }
                    } else {
                        this.syncStatus = 'Ready for Auth';
                    }
                },

                getGreeting() {
                    const hour = new Date().getHours();
                    if (hour < 12) return "Good morning";
                    if (hour < 17) return "Good afternoon";
                    return "Good evening";
                },

                sendOtpCode() {
                    if (this.phoneNumber.length < 10) {
                        alert("Please enter a valid 10-digit phone number.");
                        return;
                    }
                    this.authLoading = true;
                    // Simulate OTP API Request delay
                    setTimeout(() => {
                        this.authLoading = false;
                        this.authStep = 2;
                        this.$nextTick(() => {
                            const firstInput = document.getElementById('otp-input-0');
                            if (firstInput) firstInput.focus();
                        });
                    }, 800);
                },

                handleOtpInput(e, index) {
                    const val = e.target.value;
                    if (val && index < 5) {
                        const nextInput = document.getElementById(`otp-input-${index + 1}`);
                        if (nextInput) nextInput.focus();
                    }
                },

                handleOtpBackspace(e, index) {
                    if (!this.otpDigits[index] && index > 0) {
                        const prevInput = document.getElementById(`otp-input-${index - 1}`);
                        if (prevInput) prevInput.focus();
                    }
                },

                handleOtpPaste(e) {
                    const paste = (e.clipboardData || window.clipboardData).getData('text');
                    if (paste && paste.length === 6 && !isNaN(paste)) {
                        for (let i = 0; i < 6; i++) {
                            this.otpDigits[i] = paste[i];
                        }
                    }
                },

                async verifyOtpCode() {
                    const code = this.otpDigits.join('');
                    if (code.length < 6) {
                        alert("Please enter full 6-digit OTP code.");
                        return;
                    }

                    this.authLoading = true;
                    
                    // Trigger Firebase Auth
                    let user = null;
                    if (window.cloudSync) {
                        user = await window.cloudSync.authenticateUser();
                    }

                    const userId = user ? user.uid : 'usr_' + this.phoneNumber;
                    this.currentUserId = userId;
                    this.userPhone = this.phoneNumber;

                    // Save session persistence
                    localStorage.setItem('pos_user_session', JSON.stringify({
                        phone: this.userPhone,
                        userId: this.currentUserId
                    }));

                    this.authLoading = false;
                    this.userLoggedIn = true;
                    this.setupCloudSync();
                },

                quickDemoLogin() {
                    this.phoneNumber = '9876543210';
                    this.otpDigits = ['1', '2', '3', '4', '5', '6'];
                    this.verifyOtpCode();
                },

                async logoutUser() {
                    if (this.unsubscribeCloudListener) {
                        this.unsubscribeCloudListener();
                    }
                    if (window.cloudSync) {
                        await window.cloudSync.logout();
                    }
                    localStorage.removeItem('pos_user_session');
                    this.userLoggedIn = false;
                    this.authStep = 1;
                    this.otpDigits = ['', '', '', '', '', ''];
                    this.phoneNumber = '';
                },

                // -------------------------------------------------------------
                // FIREBASE CLOUD DATA REALTIME SYNC ENGINE
                // -------------------------------------------------------------
                setupCloudSync() {
                    this.syncStatus = 'Syncing...';
                    this.isSyncing = true;

                    if (window.cloudSync && this.currentUserId) {
                        // Real-time Firestore sync setup
                        this.unsubscribeCloudListener = window.cloudSync.subscribeToUserLoans(
                            this.currentUserId,
                            (cloudLoans) => {
                                this.isSyncing = false;
                                this.syncStatus = 'Synced to Cloud';
                                if (cloudLoans !== null) {
                                    this.customers = cloudLoans;
                                } else {
                                    // Initialize sample data for new account
                                    this.loadInitialSampleData();
                                }
                            },
                            (err) => {
                                this.isSyncing = false;
                                this.syncStatus = 'Offline (Local)';
                                this.loadLocalBackup();
                            }
                        );
                    } else {
                        this.loadLocalBackup();
                    }
                },

                syncCloudData() {
                    this.isSyncing = true;
                    if (window.cloudSync && this.currentUserId) {
                        window.cloudSync.saveUserLoans(this.currentUserId, this.customers).then(() => {
                            this.isSyncing = false;
                        });
                    } else {
                        localStorage.setItem('pos_local_backup_' + this.currentUserId, JSON.stringify(this.customers));
                        this.isSyncing = false;
                    }
                },

                loadLocalBackup() {
                    const local = localStorage.getItem('pos_local_backup_' + this.currentUserId);
                    if (local) {
                        try { this.customers = JSON.parse(local); } catch(e) { this.loadInitialSampleData(); }
                    } else {
                        this.loadInitialSampleData();
                    }
                },

                loadInitialSampleData() {
                    const today = new Date().toISOString().split('T')[0];
                    const c1Schedule = this.generateEmiSchedule(today, 3, 2667);
                    const c2Schedule = this.generateEmiSchedule(today, 12, 5000);
                    c2Schedule[0].isPaid = true;
                    c2Schedule[1].isPaid = true;

                    this.customers = [
                        {
                            id: 'c-101',
                            name: 'Test User',
                            address: 'Tech Park, Block B',
                            phone: '+91 99887 76655',
                            loanId: 'TEST-UI-001',
                            productDetails: 'Test Product',
                            totalLoanAmount: 8001,
                            downPaymentAmount: 0,
                            monthlyEmiAmount: 2667,
                            numberOfEmis: 3,
                            firstEmiDate: today,
                            dpStatus: 'Due',
                            schedule: c1Schedule
                        },
                        {
                            id: 'c-102',
                            name: 'Rahul Sharma',
                            address: '42 MG Road, Indiranagar',
                            phone: '+91 98765 43210',
                            loanId: 'LN-2026-01',
                            productDetails: '4K Smart LED TV 55"',
                            totalLoanAmount: 70000,
                            downPaymentAmount: 10000,
                            monthlyEmiAmount: 5000,
                            numberOfEmis: 12,
                            firstEmiDate: today,
                            dpStatus: 'Paid',
                            schedule: c2Schedule
                        }
                    ];
                    this.syncCloudData();
                },

                // -------------------------------------------------------------
                // LOAN CALCULATIONS & DOM HELPER FUNCTIONS
                // -------------------------------------------------------------
                generateEmiSchedule(startDateStr, tenureMonths, monthlyAmount) {
                    const schedule = [];
                    if (!startDateStr || !tenureMonths) return schedule;

                    for (let i = 0; i < tenureMonths; i++) {
                        const d = new Date(startDateStr);
                        d.setMonth(d.getMonth() + i);
                        schedule.push({
                            month: i + 1,
                            dueDate: d.toISOString().split('T')[0],
                            amount: monthlyAmount || 0,
                            isPaid: false
                        });
                    }
                    return schedule;
                },

                recalculateEmi() {
                    const remaining = (this.formData.totalLoanAmount || 0) - (this.formData.downPaymentAmount || 0);
                    const tenure = this.formData.numberOfEmis || 1;
                    this.formData.monthlyEmiAmount = remaining > 0 ? Math.round(remaining / tenure) : 0;
                },

                getInitials(name) {
                    if (!name) return 'TU';
                    const parts = name.trim().split(' ');
                    if (parts.length >= 2) {
                        return (parts[0][0] + parts[1][0]).toUpperCase();
                    }
                    return name.substring(0, 2).toUpperCase();
                },

                getPaidCount(customer) {
                    if (!customer || !customer.schedule) return 0;
                    return customer.schedule.filter(s => s.isPaid).length;
                },

                getNextDueDate(customer) {
                    if (!customer || !customer.schedule) return 'N/A';
                    const pending = customer.schedule.find(s => !s.isPaid);
                    return pending ? this.formatDate(pending.dueDate) : 'Completed';
                },

                // -------------------------------------------------------------
                // MODAL & CRUD ACTIONS
                // -------------------------------------------------------------
                openModal(mode, customer = null) {
                    this.modalMode = mode;
                    if (mode === 'add') {
                        const today = new Date().toISOString().split('T')[0];
                        this.formData = {
                            id: 'c-' + Date.now(),
                            name: '',
                            address: '',
                            phone: '+91 ',
                            loanId: 'LN-' + Math.floor(1000 + Math.random() * 9000),
                            productDetails: '',
                            totalLoanAmount: 12000,
                            downPaymentAmount: 2000,
                            monthlyEmiAmount: 2500,
                            numberOfEmis: 4,
                            firstEmiDate: today,
                            dpStatus: 'Due'
                        };
                        this.recalculateEmi();
                    } else if (mode === 'edit' && customer) {
                        this.formData = JSON.parse(JSON.stringify(customer));
                    }
                    this.showModal = true;
                },

                viewCustomerDetails(customer) {
                    this.viewingCustomer = customer;
                    this.showDetailsModal = true;
                },

                saveCustomer() {
                    if (this.modalMode === 'add') {
                        const newSchedule = this.generateEmiSchedule(
                            this.formData.firstEmiDate,
                            this.formData.numberOfEmis,
                            this.formData.monthlyEmiAmount
                        );
                        const record = { ...this.formData, schedule: newSchedule };
                        this.customers.unshift(record);
                    } else {
                        const idx = this.customers.findIndex(c => c.id === this.formData.id);
                        if (idx !== -1) {
                            const existingSchedule = this.customers[idx].schedule || [];
                            const updatedSchedule = this.generateEmiSchedule(
                                this.formData.firstEmiDate,
                                this.formData.numberOfEmis,
                                this.formData.monthlyEmiAmount
                            );

                            updatedSchedule.forEach((item, i) => {
                                if (existingSchedule[i]) {
                                    item.isPaid = existingSchedule[i].isPaid;
                                }
                            });

                            this.customers[idx] = { ...this.formData, schedule: updatedSchedule };
                        }
                    }
                    this.syncCloudData();
                    this.showModal = false;
                },

                toggleDpStatus(customer) {
                    customer.dpStatus = customer.dpStatus === 'Paid' ? 'Due' : 'Paid';
                    this.syncCloudData();
                },

                openScheduleModal(customer) {
                    this.activeScheduleCustomer = customer;
                    this.showScheduleModal = true;
                },

                toggleSingleEmi(customer, index) {
                    if (customer && customer.schedule && customer.schedule[index]) {
                        customer.schedule[index].isPaid = !customer.schedule[index].isPaid;
                        this.syncCloudData();
                    }
                },

                setAllEmisStatus(customer, status) {
                    if (customer && customer.schedule) {
                        customer.schedule.forEach(item => item.isPaid = status);
                        this.syncCloudData();
                    }
                },

                confirmDelete(customer) {
                    this.deletingCustomerId = customer.id;
                    this.showDeleteModal = true;
                },

                executeDelete() {
                    if (this.deletingCustomerId) {
                        this.customers = this.customers.filter(c => c.id !== this.deletingCustomerId);
                        this.syncCloudData();
                    }
                    this.showDeleteModal = false;
                    this.deletingCustomerId = null;
                },

                // -------------------------------------------------------------
                // COMPUTED PROPERTIES (FILTERS & STATS)
                // -------------------------------------------------------------
                get filteredCustomers() {
                    return this.customers.filter(c => {
                        const q = this.searchQuery.toLowerCase().trim();
                        const matchesSearch = !q || 
                            c.name.toLowerCase().includes(q) ||
                            (c.phone && c.phone.toLowerCase().includes(q)) ||
                            c.loanId.toLowerCase().includes(q) ||
                            c.productDetails.toLowerCase().includes(q);

                        if (!matchesSearch) return false;

                        const paidCount = this.getPaidCount(c);
                        if (this.statusFilter === 'pending') {
                            return paidCount < c.numberOfEmis;
                        }
                        if (this.statusFilter === 'cleared') {
                            return paidCount === c.numberOfEmis;
                        }
                        if (this.statusFilter === 'dp_due') {
                            return c.dpStatus === 'Due';
                        }

                        return true;
                    });
                },

                get stats() {
                    let totalLoans = this.customers.length;
                    let fullyPaidCount = 0;
                    let pendingDpCount = 0;

                    this.customers.forEach(c => {
                        const paidEmis = this.getPaidCount(c);
                        const totalEmis = c.numberOfEmis || 1;
                        
                        if (paidEmis === totalEmis) fullyPaidCount++;
                        if (c.dpStatus === 'Due') pendingDpCount++;
                    });

                    return {
                        totalLoans,
                        fullyPaidCount,
                        pendingDpCount
                    };
                },

                formatDate(dStr) {
                    if (!dStr) return 'N/A';
                    const date = new Date(dStr);
                    return date.toLocaleDateString('en-GB', { day: '02-digit', month: 'short', year: 'numeric' });
                },

                formatCurrency(val) {
                    return '₹' + Number(val || 0).toLocaleString('en-IN');
                }
            };
        }
    </script>
</body>
